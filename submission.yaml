submission:
  title: "MissionGuard AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Maintenance teams often lack a clear, data-driven view of asset readiness before a mission window.
    Calendar-based maintenance can miss early warning signs in sensor data, making it difficult to identify assets that may require attention and prioritize maintenance actions in time.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
     MissionGuard AI is an explainable predictive maintenance copilot that analyzes synthetic sensor and maintenance data to assess asset readiness, identify potential failure risks, explain contributing conditions, and prioritize recommended maintenance actions.

  key_features:

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Mission readiness classification using READY, CAUTION, and NOT READY states"
    - "Sensor health analysis using vibration, temperature, pressure, and usage data"
    - "Predictive failure risk scoring with LOW, MEDIUM, and HIGH risk levels"
    - "Explainable analysis showing the conditions contributing to asset risk"
    - "Prioritized maintenance recommendations for high-risk assets"

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["Flask"]
    ibm_technologies: ["IBM Bob"]
    databases: ["CSV-based synthetic dataset"]
    other: ["GitHub", "VS Code"]
                   

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
   MissionGuard AI brings asset health, mission readiness, risk analysis, explainability, and maintenance prioritization together in one workflow.
    Instead of only identifying a risky asset, the prototype explains the detected conditions and converts them into prioritized maintenance recommendations, making the result easier to understand and act upon.

  known_limitations: >                 # Optional but recommended — be honest about gaps
   The prototype uses synthetic asset data for demonstration.
    Readiness and risk scores are proof-of-concept indicators and are not validated against real operational data.
    The prototype is intended for decision-support demonstration and not for autonomous real-world mission decisions.


